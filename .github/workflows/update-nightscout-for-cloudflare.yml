name: Update Nightscout for Cloudflare
run-name: Check for Nightscout for Cloudflare updates

on:
  workflow_dispatch:

concurrency:
  group: nscf-update-${{ github.repository }}
  cancel-in-progress: false

env:
  NSCF_UPSTREAM_REPOSITORY: sid-luo/nightscout-for-cloudflare
  NSCF_UPSTREAM_BRANCH: main
  NSCF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  validate:
    name: Check and validate update
    if: github.repository != 'sid-luo/nightscout-for-cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      update_available: ${{ steps.update.outputs.update_available }}
      base_sha: ${{ steps.update.outputs.base_sha }}
      upstream_sha: ${{ steps.update.outputs.upstream_sha }}
      tree_sha: ${{ steps.update.outputs.tree_sha }}
    steps:
      - name: Check out the deployed copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Prepare the official update
        id: update
        run: bash scripts/update-from-upstream.sh validate

      - name: Install dependencies
        if: steps.update.outputs.update_available == 'true'
        run: npm ci

      - name: Build the merged version
        if: steps.update.outputs.update_available == 'true'
        run: npm run build

      - name: Check deployment configuration
        if: steps.update.outputs.update_available == 'true'
        run: npm run test:cloudflare-config

  apply:
    name: Apply validated update
    needs: validate
    if: needs.validate.outputs.update_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the deployed copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Apply the validated update
        env:
          NSCF_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          NSCF_UPSTREAM_SHA: ${{ needs.validate.outputs.upstream_sha }}
          NSCF_TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
        run: bash scripts/update-from-upstream.sh apply
